name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./update.sh
      - name: Build bumped package
        run: |
          if ! git diff --quiet; then
            nix build .#default -L
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update
          title: "jagex-launcher: update"
          commit-message: "jagex-launcher: update to latest upstream"
          body: Automated bump from the launcher's electron-updater feed.
